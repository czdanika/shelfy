<form class="langpick" method="get" action="/lang">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
  <select name="code" aria-label="{{ t('me.language') }}" onchange="this.form.submit()">
    {% for code, name in languages|sort(attribute='1') %}<option value="{{ code }}" lang="{{ code }}" {% if code == lang %}selected{% endif %}>{{ name }}</option>{% endfor %}
  </select>
  <noscript><button class="btn small" type="submit">OK</button></noscript>
</form>
