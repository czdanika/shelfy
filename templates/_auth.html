{% extends "base.html" %}
{% block body %}
<main class="auth">
  <div class="card">
    <div class="row between">
      <span class="row" style="gap: 10px">
        <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 6h8a4 4 0 0 1 4 4v16a3 3 0 0 0-3-3H6z" fill="#0F766E"/><path d="M26 6h-6a2 2 0 0 0-2 2v18a3 3 0 0 1 3-3h5z" fill="#F59E0B"/></svg>
        <strong style="font-family: var(--serif); font-size: 26px">{{ t('app.name') }}</strong>
      </span>
      <span class="small">{% for code, name in languages %}{% if code == lang %}<strong>{{ code|upper }}</strong>{% else %}<a href="/lang/{{ code }}" title="{{ name }}">{{ code|upper }}</a>{% endif %}{% if not loop.last %} / {% endif %}{% endfor %}</span>
    </div>
    {% block form %}{% endblock %}
  </div>
</main>
{% endblock %}
