{% extends "base.html" %}
{% block title %}{{ t('nav.help') }}{% endblock %}
{% block content %}
<h1>{{ t('nav.help') }}</h1>
<div class="helpwrap">
  <nav class="helptoc" aria-label="{{ t('nav.help') }}">
    {% for id, title in toc %}<a href="#{{ id }}">{{ title|striptags }}</a>{% endfor %}
  </nav>
  <article class="help card">{{ content }}</article>
</div>
{% endblock %}
