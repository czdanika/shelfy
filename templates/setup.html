{% extends "_auth.html" %}
{% block title %}{{ t('setup.title') }}{% endblock %}
{% block form %}
<h1 style="font-size: 24px">{{ t('setup.title') }}</h1>
<p class="muted" style="margin: 0">{{ t('setup.intro') }}</p>
{% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/setup" style="display: flex; flex-direction: column; gap: 14px">
  <div class="field"><label for="u">{{ t('login.username') }}</label><input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" required autofocus></div>
  <div class="field"><label for="p">{{ t('login.password') }} <span class="muted">({{ t('setup.min8') }})</span></label><input id="p" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
  <div class="field"><label for="p2">{{ t('setup.password2') }}</label><input id="p2" name="password2" type="password" autocomplete="new-password" minlength="8" required></div>
  <button class="btn primary" type="submit">{{ t('setup.submit') }}</button>
</form>
{% endblock %}
