# Shelfy – example deployment (Docker Compose / Portainer stack)
#
#   1. Create the folders on your NAS (see the volumes below)
#   2. Portainer: Stacks → Add stack → Web editor, paste this file
#      (or use the Docker / Container Manager app of your NAS)
#   3. Change the left side of the volume lines to your own folders
#   4. Open http://<nas-ip>:18200 and create the administrator account
#
# Folder examples: TerraMaster /Volume1/DockerAppsData/shelfy · Synology /volume1/docker/shelfy ·
#                  QNAP /share/Container/shelfy · Unraid /mnt/user/appdata/shelfy

services:
  shelfy:
    image: ghcr.io/czdanika/shelfy:latest
    container_name: shelfy
    restart: unless-stopped
    ports:
      - "18200:8080"                                  # NAS port : container port (change only the left one)
    volumes:
      - /Volume1/DockerAppsData/shelfy:/data                  # database, settings, backups and the book files – back this up
      - /Volume1/DockerAppsData/shelfy-ingest:/ingest         # watched folder: ebooks copied here are imported (optional)
      # - /Volume1/Books/Shelfy:/data/library         # keep the book files in a separate share (optional)
    environment:
      - TZ=Europe/Budapest                            # time zone for the timestamps
      # Default interface language (also used for category tags). Each user can still pick their own.
      #   en English   hu Magyar     de Deutsch    fr Français   it Italiano   es Español   pt Português
      #   pl Polski    ru Русский    tr Türkçe     ja 日本語      ko 한국어      zh-Hans 简体中文  zh-Hant 繁體中文
      - DEFAULT_LANGUAGE=en
      - INGEST_DIR=/ingest                            # turns the watched folder on – remove with the /ingest volume
      # Which user writes the files (default 1000/1000). Set these to the owner of the folders above
      # if you see "permission denied" (find them with: id <username>).
      # - PUID=1026
      # - PGID=100
      # First admin from the stack (otherwise create it in the browser):
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=at-least-8-characters
      # Online lookup, its sources and the e-mail (SMTP) account are set in the UI: Settings (left menu).
