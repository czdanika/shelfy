# Shelfy – example deployment (Docker Compose / Portainer stack)
#
#   1. Portainer: Stacks → Add stack → Web editor, paste this file
#   2. Adjust the volumes to your own folders
#   3. Open http://<server>:18200 and create the administrator account

services:
  shelfy:
    image: ghcr.io/czdanika/shelfy:latest
    container_name: shelfy
    restart: unless-stopped
    # user: "1026:100"                           # optional: run as the NAS user that owns the folders below (id <user>)
    ports:
      - "18200:8080"
    volumes:
      - shelfy-data:/data                        # database, library, caches
      # - /srv/books/shelfy:/data/library         # keep the book files in a separate folder (optional)
      # - /srv/books/inbox:/ingest                # watched folder (with subfolders): ebooks copied here are imported, then removed from here
    environment:
      - DEFAULT_LANGUAGE=en                      # en | de | fr | hu
      # - INGEST_DIR=/ingest
      - ONLINE_LOOKUP=true                       # Moly.hu / Google Books / Open Library lookup
      - METADATA_PROVIDERS=moly,google,openlibrary
      # First admin from environment variables (otherwise create it in the browser):
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=at-least-8-characters
      # SMTP for Send to Kindle is configured in the UI: Administration → Settings

volumes:
  shelfy-data:
